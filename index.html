<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="todo-card">
    <header class="todo-header">
      <div class="header-topline">
        <p class="eyebrow">我的日常</p>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切換深色模式" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true">🌙</span>
          <span class="theme-label">深色模式</span>
        </button>
      </div>
      <h1>待辦清單</h1>
      <p class="subtitle">把今天重要的事，一件一件完成。</p>
    </header>

    <section class="smart-task" aria-labelledby="smart-task-title">
      <h2 id="smart-task-title">✨ AI 智慧任務</h2>
      <p class="smart-task-description">輸入自然語句，離線辨識任務、優先程度與日期；分析後可修改再新增。</p>
      <form class="smart-task-form" id="smart-task-form">
        <label class="sr-only" for="smart-task-input">自然語句</label>
        <input
          id="smart-task-input"
          name="smartTask"
          type="text"
          placeholder="例如：Nộp bài tập lúc 8h tối mai ưu tiên cao"
          autocomplete="off"
          maxlength="200"
          required
        >
        <button type="submit">解析並填入</button>
      </form>
      <p class="smart-task-status" id="smart-task-status" role="status" aria-live="polite"></p>
    </section>

    <form class="todo-form" id="todo-form">
      <label class="sr-only" for="todo-input">新增待辦事項</label>
      <input
        id="todo-input"
        name="todo"
        type="text"
        placeholder="接下來要完成什麼？"
        autocomplete="off"
        maxlength="120"
      >
      <label class="sr-only" for="todo-priority">優先程度</label>
      <select id="todo-priority" name="priority">
        <option value="high">高優先</option>
        <option value="medium" selected>中優先</option>
        <option value="low">低優先</option>
      </select>
      <label class="sr-only" for="todo-due-date">到期日</label>
      <input id="todo-due-date" name="dueDate" type="date">
      <button type="submit">新增</button>
    </form>

    <nav class="todo-filters" aria-label="待辦事項篩選" role="group">
      <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </nav>

    <section class="todo-section" aria-labelledby="list-title">
      <h2 id="list-title" class="sr-only">待辦事項列表</h2>
      <ul class="todo-list" id="todo-list"></ul>
      <p class="empty-state" id="empty-state">還沒有任何待辦事項，新增一個吧！</p>
    </section>

    <footer class="todo-footer">
      <span id="remaining-count">未完成：0 項</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
